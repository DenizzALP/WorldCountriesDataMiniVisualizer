<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Countries Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="titles">
            <h1 id="title">World Countries Data</h1>    
            <h2 id="explanation">Currently, we have 250 countries</h2>
        </div>

        <div class="select-buttons">
            <div class="select-buttons-row">
                <button id="population">Population</button>
                <button id="languages">Languages</button>
            </div>
            <p id="buttons-titles"></p>
        </div>

        <div class="output">
            <div class="output-container">
                <div class="column-country">
                    
                </div>
                <div class="column-chart">
                    
                </div>
                <div class="column-value">
                    
                </div>
            </div>
        </div>
    </div>
    <script src="./countries.js"></script>
    <script src="./script.js"></script>
</body>
</html>
